name: Build APK

on:
  push:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build
        run: ./gradlew --no-daemon assembleDebug
      - name: Rename
        run: cp app/build/outputs/apk/debug/app-debug.apk FlappyBot.apk
      - uses: actions/upload-artifact@v4
        with:
          name: FlappyBot
          path: FlappyBot.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          sleep 3
          gh release create latest FlappyBot.apk --target "$GITHUB_SHA" --title "FlappyBot" --notes "Latest build of FlappyBot. Download FlappyBot.apk below."
