plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mahmoud.flappybot'
    compileSdk 34

    defaultConfig {
        applicationId 'com.mahmoud.flappybot'
        minSdk 26
        targetSdk 34
        versionCode 6
        versionName '1.5'
    }

    // Shared throw-away key so every build can be installed over the previous one.
    signingConfigs {
        shared {
            storeFile file('../keystore/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.shared
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
